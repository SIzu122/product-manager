<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品登録アプリ</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>商品管理</h1>

    <input id="nameInput" type="text" placeholder="商品名">
    <input id="priceInput" type="text" placeholder="価格">
    <input id="searchInput" type="text" placeholder="商品を検索">

    <button id="addButton">商品を追加</button>
    <button id="clearButton">全削除</button>

    <p id="message"></p>

    <ul id="productList"></ul>

    <p id="total"></p>

    <script src="script.js">

    </script>

</body>

</html>
